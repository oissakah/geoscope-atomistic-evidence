name: Verify frozen study

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Verify tracked study files
        run: python verify_repository.py

      - name: Reproduce every frozen score
        run: python reproduce_analysis.py --output-folder "$RUNNER_TEMP/geoscope-recomputed"

      - name: Run final workflow CPU tests
        env:
          PYTHONPATH: workflows/phase3_final/src
        run: python -m unittest discover -s workflows/phase3_final/tests -v
